name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      TAJWEED_ENGINE: demo
      TAJWEED_CORS_ORIGINS: http://127.0.0.1:5173
      PRAYER_API_BASE_URL: https://api.example.invalid/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q app tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dependency and SAST audit
        run: |
          python -m pip install --quiet pip-audit bandit
          pip-audit -r requirements.txt
          bandit -r app -ll

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
      VITE_TAJWEED_API_URL: /api/tajweed
      API_PROXY_TARGET: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Built bundle secret scan
        working-directory: .
        run: bash .github/scripts/check-secrets.sh --scan-dist

  security:
    name: Secret and env hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Env examples must exist
        run: |
          test -f backend/.env.example
          test -f frontend/.env.example

      - name: No local .env files may be tracked
        run: |
          tracked_envs="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '\.env\.example$|\.env\..*\.example$' || true)"
          if [ -n "$tracked_envs" ]; then
            echo "::error::Local env files are tracked in Git:"
            echo "$tracked_envs"
            exit 1
          fi

      - name: VITE_ names must not look like secrets
        run: |
          if git grep -nIE 'VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASS)[A-Z0-9_]*[[:space:]]*=' -- frontend; then
            echo "::error::VITE_* values are public; do not give them secret-looking names"
            exit 1
          fi

      - name: No endpoint URLs in source config
        run: |
          if grep -nE 'https?://' backend/app/config.py frontend/src/config.js; then
            echo "::error::API endpoints must come from .env files, not source code"
            exit 1
          fi

      - name: Scan tracked files for obvious secrets
        run: bash .github/scripts/check-secrets.sh
