name: CI & CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
      VITE_TAJWEED_API_URL: /api/tajweed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Scan built bundle for secrets
        run: bash ../.github/scripts/check-secrets.sh --scan-dist

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      TAJWEED_ENGINE: demo
      TAJWEED_CORS_ORIGINS: http://127.0.0.1:5173
      PRAYER_API_BASE_URL: https://api.aladhan.com/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q .

      - name: Import app and check routes
        run: python -c "from main import app; assert any(r.path == '/health' for r in app.routes); print('FastAPI app imports; /health registered')"

      - name: Production config guards
        run: |
          python - <<'PY'
          from config import Settings

          valid = dict(
              environment="production",
              tajweed_cors_origins="https://app.example.com",
              allowed_hosts="api.example.com",
              session_token_secret="a" * 48,
              prayer_api_base_url="https://api.aladhan.com/v1",
          )
          Settings(**valid)
          try:
              Settings(**{**valid, "session_token_secret": "too-short"})
          except ValueError:
              print("production config guards OK")
          else:
              raise SystemExit("production settings accepted a short session secret")
          PY

  security:
    name: Secret & env hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Env examples must exist
        run: |
          test -f backend/.env.example
          test -f frontend/.env.example

      - name: No local .env files may be tracked
        run: |
          allowed='(\.env\.example(\.prod)?|\.env\.production)$'
          tracked_envs="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev "$allowed" || true)"
          if [ -n "$tracked_envs" ]; then
            echo "::error::Local env files are tracked in Git:"
            echo "$tracked_envs"
            exit 1
          fi

      - name: VITE_ names must not look like secrets
        run: |
          if git grep -nIE 'VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASS)[A-Z0-9_]*[[:space:]]*=' -- frontend; then
            echo "::error::VITE_* values are public; do not give them secret-looking names"
            exit 1
          fi

      - name: No endpoint URLs in backend settings
        run: |
          if grep -nE 'https?://' backend/config.py; then
            echo "::error::API endpoints must come from .env files, not source code"
            exit 1
          fi

      - name: Scan tracked files for obvious secrets
        run: bash .github/scripts/check-secrets.sh

  deploy:
    name: Deploy to Vercel (production)
    needs: [frontend, backend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
      VITE_TAJWEED_API_URL: ${{ vars.VITE_TAJWEED_API_URL || '/api/tajweed' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
